[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "progic"
dynamic = ["version"]
description = "A CLI for creating and editing Logic Pro projects, designed to be driven by LLM agents."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Roben Kleene" }]
keywords = ["logic-pro", "logicx", "daw", "midi", "llm", "agent"]
dependencies = []

[project.scripts]
progic = "progic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "progic.__version__" }

[tool.setuptools.package-data]
progic = ["data/*"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.9"
